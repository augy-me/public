name: watch-prices

# Runs the Binance part of the price watcher (code in market-runner/). Public repo: Actions minutes are free.
# No schedule, no data stored here. The Cloudflare Worker market-cron dispatches this with a job id only
# (inputs are public here); the runner claims the job's one-time token with the run's OIDC token (once per job),
# asks the Worker what to fetch, posts the prices back, sends the ntfy pushes
# the Worker hands over and reports which arrived. Everything else (thresholds, other sources, saving) is on the Worker.
# Started by hand: `test_notify` previews current prices of every asset. Nothing else is sent through this repo.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (from the Worker market-cron)"
        type: string
        default: ""
      test_notify:
        description: "Test send: push the current price of every asset in the usual format, ignoring thresholds, without saving state"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # OIDC token: proves to the Worker that the run comes from this repo on main

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_URL: ${{ vars.CORE_URL }}  # repository variable: address of the Worker market-cron
    defaults:
      run:
        working-directory: market-runner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check CORE_URL
        run: test -n "$CORE_URL" || { echo "::error::Repository variable CORE_URL is not set (Settings > Secrets and variables > Actions > Variables)"; exit 1; }

      - name: Fetch Binance prices for the job
        env:
          JOB: ${{ inputs.job }}
        run: python -m market.runner ${{ inputs.test_notify && '--preview' || '' }}
